name = "farmconnect-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ─── Local development ───────────────────────────────────────────────────────
# Run: wrangler dev
# Secrets are loaded from .dev.vars (see .dev.vars.example)

[[d1_databases]]
binding = "DB"
database_name = "bhoomi-mithra-db"
database_id = "95e6dfb4-9257-485c-b33d-b760bd466eb7"

# ─── Production secrets ──────────────────────────────────────────────────────
# Set via: wrangler secret put GEMINI_API_KEY
# NEVER commit real keys to this file.

[vars]
# Public, non-sensitive config variables only.
ALLOWED_ORIGIN = "*"
